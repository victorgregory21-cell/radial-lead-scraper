[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radial-lead-scraper"
version = "0.1.0"
description = "Free API-keyless worldwide radial lead discovery and enrichment scraper."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Elroy Jahjaloo" }
]
keywords = ["lead-generation", "web-scraping", "osm", "overpass", "geocoding", "osint", "csv"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "requests",
  "beautifulsoup4",
  "geopy",
  "ddgs",
  "tldextract",
]

[project.optional-dependencies]
dashboard = ["streamlit"]
dev = ["streamlit"]

[project.scripts]
radial-leads = "radial_lead_scraper:main"

[tool.setuptools]
py-modules = ["radial_lead_scraper"]
